name: Auto-merge approved Copilot PRs

on:
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge when approved
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          AUTHOR="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          IS_DRAFT="$(gh pr view "$PR_URL" --json isDraft --jq '.isDraft')"
          DECISION="$(gh pr view "$PR_URL" --json reviewDecision --jq '.reviewDecision')"
          HEAD_SHA="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"

          if [[ "$AUTHOR" != "Copilot" ]]; then
            exit 0
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            exit 0
          fi

          if [[ "$DECISION" != "APPROVED" ]]; then
            exit 0
          fi

          gh pr merge "$PR_URL" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"
